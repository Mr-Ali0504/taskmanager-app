# =============================================================================
# Nginx Configuration for React Single-Page Application (SPA)
# Reference: https://nginx.org/en/docs/
#
# The KEY config here is 'try_files $uri $uri/ /index.html'
# WHY: React Router handles navigation client-side. When you refresh the page
# on a route like /tasks/123, Nginx would normally return 404 (file not found).
# This config tells Nginx: "if the file doesn't exist, serve index.html instead"
# and React Router takes over from there.
# =============================================================================

server {
    listen       80;
    server_name  localhost;

    # Root directory where Vite's built files are placed
    root   /usr/share/nginx/html;
    index  index.html;

    # Serve static files, fall back to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images) for performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
